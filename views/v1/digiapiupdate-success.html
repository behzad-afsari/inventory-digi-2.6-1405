<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .main {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        direction: rtl;
      }
      .box {
        width: 500px;
        height: 300px;
        text-align: center;
      }
      .message{
        background-color: rgb(255, 240, 171);
        border-radius: 10px;
        padding: 10px;
      }
      .btn {
        background-color: rgb(255, 217, 135);
        border-radius: 10px;
        padding: 10px;
        width: 50px;
        color: white;
        margin: auto;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <div class="box">
        <div class="message">
          <h1>اطلاعات محصولات بروز شد.</h1>
          <h3 class="btn"><a href="/">بازگشت</a></h3>
        </div>
      </div>
    </div>
  </body>
</html>
